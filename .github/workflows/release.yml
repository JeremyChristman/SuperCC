name: Release

on:
  push:
    tags: ['jc-*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing jc-N tag to build a draft release for'
        required: true

# Creating a release needs write access. Recently created repositories default GITHUB_TOKEN to
# read-only, and without this the whole build succeeds and then fails on the very last step.
# id-token and attestations are for build provenance, below.
permissions:
  contents: write
  id-token: write
  attestations: write

# Two tag pushes in quick succession would otherwise race on the same draft.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    # Actions are pinned to commit SHAs, not tags. This job's output is a binary that strangers
    # download and run, and RELEASING.md has the maintainer publish CI's zip rather than a local
    # build -- so a mutated tag on any of these actions would land code in the job that produces
    # those bytes, and a trojaned jar launches perfectly normally. Dependabot (.github/dependabot.yml)
    # keeps the pins current; pinning without it just rots on a fixed version instead.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          # Nothing here uses git after checkout, and leaving a write-scoped token in .git/config
          # while the job compiles and runs Java and three PowerShell scripts is free risk.
          persist-credentials: false

      - name: Set up JDK 16
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          # Pinned exactly, not '16'. The point is to match the maintainer's Oracle 16.0.2+7, and
          # javac's output is not identical across JDK versions.
          java-version: '16.0.2+7'

      - name: Verify the splice invariants
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File verify-splice.ps1

      - name: Test
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File run-tests.ps1 -ResultsPath test-results

      # THE guard this workflow exists for. The git tag and the tag baked into the jar are two
      # independent facts and nothing else compares them. Push jc-11 while BUILD_TAG still reads
      # [jc-10] and every other gate passes: the README check looks for jc-10 and finds it, the zip
      # is named SuperCC-jc-10.zip, and release jc-11 publishes a jar that calls itself jc-10.
      #
      # The tag reaches PowerShell through the environment, NEVER through a ${{ }} expression in a
      # run: block. Actions substitutes expressions as raw text before PowerShell parses the line,
      # and inside a double-quoted string $(...) and backticks execute -- and `jc-$(whoami)` and
      # jc-`whoami` are both valid, pushable git tag names that match this workflow's jc-* filter.
      # Anyone able to push a tag could otherwise run arbitrary code here with a write-scoped token,
      # including a credential too narrow to edit this file. The regex is the belt to that braces.
      - name: Package (tag must match BUILD_TAG)
        shell: powershell
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if ($env:TAG -notmatch '^jc-\d+$') { throw "refusing to build a tag that is not jc-N: $env:TAG" }
          powershell -ExecutionPolicy Bypass -File build.ps1 -Package -ExpectTag $env:TAG -Manifest dist/build-manifest.json

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-test-results
          path: test-results/
          if-no-files-found: warn

      # Signs a statement that THIS workflow, at this commit, produced these exact bytes. Anyone can
      # then check it before running the download:
      #
      #     gh attestation verify SuperCC-jc-N.zip -R JeremyChristman/SuperCC
      #
      # This matters more here than in most projects: the published bytes come off the runner rather
      # than off the maintainer's machine, the jar is not byte-reproducible (zip entry timestamps
      # vary), so a local rebuild cannot be hash-compared against it, and a tampered jar would
      # launch and play perfectly normally. Provenance is the only check on that path that does not
      # depend on noticing something.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/SuperCC-*.zip

      # DRAFT on purpose. CI's jar is built by a different machine than the maintainer's, and the
      # playtest gate means a human launches the actual artifact before anyone downloads it. So the
      # workflow builds and verifies the zip and stages the release; publishing stays a human act:
      # download the asset, run it, then hit publish.
      #
      # The existence check is explicit rather than relying on `gh release create` to reject a
      # duplicate. It does return 422 for a PUBLISHED release, but draft releases are not bound to
      # a git tag until they are published, so a second run would otherwise likely produce a SECOND
      # draft carrying the same tag rather than an error.
      - name: Create the draft release
        shell: powershell
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Explicit exit-code checks rather than PowerShell's error handling, matching the repo's
          # own scripts. On PowerShell 5.1 REDIRECTING a native command's stderr wraps every line
          # in a NativeCommandError, which the Actions wrapper's $ErrorActionPreference='stop' then
          # treats as terminating -- so `gh release view ... *> $null` turned the CORRECT answer
          # ("release not found", i.e. safe to proceed) into a failed step. Never redirect a native
          # command's stderr here; let it print and read $LASTEXITCODE instead.
          $ErrorActionPreference = 'Continue'

          if ($env:TAG -notmatch '^jc-\d+$') { throw "refusing to release a tag that is not jc-N: $env:TAG" }
          $zip = Get-ChildItem dist -Filter "SuperCC-$($env:TAG).zip" -File
          if (-not $zip) { throw "no dist\SuperCC-$($env:TAG).zip was produced" }

          gh release view $env:TAG | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "a release for $($env:TAG) already exists -- delete it first, or use a new tag" }
          Write-Host "no existing release for $($env:TAG); creating the draft"

          $notes = @"
          Built from ``$($env:TAG)`` by the release workflow.

          **This is a draft.** Launch the jar from the attached zip before publishing -- the
          playtest gate is a human step, and CI cannot do it.

          The zip contains ``SuperCC.jar``, a stock ``succ_settings.ini`` generated by the jar
          itself, ``README.txt`` and ``COPYING``. See README section 7 for what this build changed.
          "@
          gh release create $env:TAG $zip.FullName --draft --title $env:TAG --notes $notes
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed (exit $LASTEXITCODE)" }
          Write-Host "drafted release $($env:TAG) with $($zip.Name)"
