name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only is all CI needs. The release workflow asks for more, separately.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Windows only, and not for lack of ambition: the build shells out to robocopy, every script is
    # PowerShell, and the product is a Windows desktop app. A Linux job would test nothing real.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # JDK 16, deliberately, not something newer. The committed .class baseline was built by
      # IntelliJ against Java 16, and while --release 16 on a newer JDK compiles fine, javac 17 does
      # not emit identical bytecode to javac 16 for the same source. Matching the maintainer's own
      # JDK (Oracle 16.0.2+7) keeps CI's jar comparable to the one he builds and ships.
      # Pinned to the exact build rather than '16', so the property this comment claims is enforced
      # rather than left to whatever Adoptium currently calls latest-16.
      - name: Set up JDK 16
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          # setup-java v6 turns verify-signature ON by default, and Temurin never published a
          # signature for 16.0.2+7 -- an old release predating that practice -- so the step fails
          # with "no signature URL was found". The JDK version is not negotiable: the committed
          # .class baseline was built against Java 16 and javac 17 does not emit identical bytecode
          # (ADR 0001/0002), so the check is declined rather than the version moved. This is not a
          # regression: setup-java v4 performed no signature check at all, and the download is still
          # an exact pinned build fetched over HTTPS from Adoptium's own release.
          verify-signature: false
          java-version: '16.0.2+7'

      # Windows PowerShell 5.1, not pwsh 7 -- see docs/adr/0006-ci-runs-windows-powershell-5-1.md.
      # The repo's workarounds (hand-built zip entries, both Compression assemblies, ASCII for
      # javac input) only exist because of 5.1 behavior, and pwsh 7 would let a 5.1-only
      # regression through unnoticed.
      #
      # NOTE for anyone adding a step: Actions wraps every `run:` with $ErrorActionPreference='stop'
      # and appends `exit $LASTEXITCODE`, so the LAST native command decides the step's result.
      # Never end a step with robocopy, git diff, or findstr.

      - name: No level set may be committed
        shell: powershell
        run: |
          # .dat/.tws files are third-party content and are not ours to redistribute. .gitignore
          # covers this, but .gitignore does nothing about a file added with `git add -f`, and this
          # is exactly what gets committed by accident while reproducing a bug.
          # succ_error*.log and succ_settings.ini are added here for the same reason: both are
          # written by the program into whatever directory it was launched from, both contain
          # personal paths, and .gitignore does nothing about `git add -f`.
          $tracked = git ls-files '*.dat' '*.tws' '*.ccl' '*.dac' 'succ_error*.log' 'succ_settings.ini'
          if ($tracked) {
            Write-Host "::error::files that must never be committed are tracked: $($tracked -join ', ')"
            exit 1
          }
          Write-Host "no level set, solution, settings or log files are tracked"

      - name: Verify the splice invariants
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File verify-splice.ps1

      - name: Build
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File build.ps1 -Manifest dist/build-manifest.json

      - name: Test
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File run-tests.ps1 -NoBuild -ResultsPath test-results

      - name: Publish test results
        # Runs even when the tests failed -- that is the case where the report matters most.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results
          path: test-results/
          if-no-files-found: warn

      - name: Upload the built jar
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SuperCC-jar
          path: |
            SuperCC.jar
            dist/build-manifest.json
          if-no-files-found: error
