name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only is all CI needs. The release workflow asks for more, separately.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Windows only, and not for lack of ambition: the build shells out to robocopy, every script is
    # PowerShell, and the product is a Windows desktop app. A Linux job would test nothing real.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # JDK 16, deliberately, not something newer. The committed .class baseline was built by
      # IntelliJ against Java 16, and while --release 16 on a newer JDK compiles fine, javac 17 does
      # not emit identical bytecode to javac 16 for the same source. Matching the maintainer's own
      # JDK (Oracle 16.0.2+7) keeps CI's jar comparable to the one he builds and ships.
      # Pinned to the exact build rather than '16', so the property this comment claims is enforced
      # rather than left to whatever Adoptium currently calls latest-16.
      - name: Set up JDK 16
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          # setup-java v6 turns verify-signature ON by default, and Temurin never published a
          # signature for 16.0.2+7 -- an old release predating that practice -- so the step fails
          # with "no signature URL was found". The JDK version is not negotiable: the committed
          # .class baseline was built against Java 16 and javac 17 does not emit identical bytecode
          # (ADR 0001/0002), so the check is declined rather than the version moved. This is not a
          # regression: setup-java v4 performed no signature check at all, and the download is still
          # an exact pinned build fetched over HTTPS from Adoptium's own release.
          verify-signature: false
          java-version: '16.0.2+7'

      # Windows PowerShell 5.1, not pwsh 7 -- see docs/adr/0006-ci-runs-windows-powershell-5-1.md.
      # The repo's workarounds (hand-built zip entries, both Compression assemblies, ASCII for
      # javac input) only exist because of 5.1 behavior, and pwsh 7 would let a 5.1-only
      # regression through unnoticed.
      #
      # NOTE for anyone adding a step: Actions wraps every `run:` with $ErrorActionPreference='stop'
      # and appends `exit $LASTEXITCODE`, so the LAST native command decides the step's result.
      # Never end a step with robocopy, git diff, or findstr.

      - name: No level set may be committed
        shell: powershell
        run: |
          # .dat/.tws files are third-party content and are not ours to redistribute. .gitignore
          # covers this, but .gitignore does nothing about a file added with `git add -f`, and this
          # is exactly what gets committed by accident while reproducing a bug.
          # succ_error*.log and succ_settings.ini are added here for the same reason: both are
          # written by the program into whatever directory it was launched from, both contain
          # personal paths, and .gitignore does nothing about `git add -f`.
          # corpus.ps1's run outputs list a personal collection's packs and levels: corpus-results\ by
          # default, and ANY tracked file, whatever its name, by the "#jar<TAB>" header each opens with.
          # A guard that could not look must not report that it found nothing, so git failing fails it.
          $tracked = @(git ls-files '*.dat' '*.tws' '*.ccl' '*.dac' 'succ_error*.log' 'succ_settings.ini' 'corpus-results/*')
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::git ls-files failed (exit $LASTEXITCODE)"; exit 1 }
          # git writes paths as UTF-8; PowerShell 5.1 would decode them in the console's code page, and a
          # non-ASCII name would come back garbled and unopenable. Read them as UTF-8.
          [Console]::OutputEncoding = New-Object Text.UTF8Encoding($false)
          $all = @((git ls-files -z) -split "`0" | Where-Object { $_ })
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::git ls-files failed (exit $LASTEXITCODE)"; exit 1 }
          # Each file's FIRST LINE, through a reader that honors a byte-order mark: a copy re-saved with
          # a UTF-8 BOM, or as UTF-16 by PowerShell 5.1's `>`, still opens with "#jar<TAB>" once decoded
          # (a plain `git grep '^#jar'` missed both -- reproduced). Binary files simply never match.
          # A tracked file that cannot be opened is a FAILURE, not a pass: unread is not clean.
          $unread = @()
          foreach ($f in $all) {
            $first = $null
            # Only a short decoded prefix: ReadLine on a binary with no newline would buffer all of it.
            try {
              $r = New-Object IO.StreamReader($f, $true)
              try { $buf = New-Object char[] 16; $n = $r.Read($buf, 0, 16); $first = New-Object string($buf, 0, $n) }
              finally { $r.Dispose() }
            }
            catch { $unread += $f; continue }
            if ($first -and $first.StartsWith("#jar`t")) { $tracked += $f }
          }
          if ($unread) { Write-Host "::error::tracked files the guard could not read: $($unread -join ', ')"; exit 1 }
          if ($tracked) {
            # once each: a file in corpus-results\ that also opens with "#jar" would otherwise be listed twice
            Write-Host "::error::files that must never be committed are tracked: $(@($tracked | Select-Object -Unique) -join ', ')"
            exit 1
          }
          Write-Host "no level set, solution, settings, log or corpus-run files are tracked"

      - name: Verify the splice invariants
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File verify-splice.ps1

      - name: Build
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File build.ps1 -Manifest dist/build-manifest.json

      - name: Test
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File run-tests.ps1 -NoBuild -ResultsPath test-results

      # The differential trace is the instrument that took the desync count from 135 to 0, and it
      # shipped BROKEN for its whole life for one reason: it needs a level set and a solution,
      # neither of which may be committed here, so nothing ever ran it. Run against a level where
      # the two engines agree perfectly, its aligner reported a divergence at tick 0.
      #
      # -SelfTest exercises the alignment on synthetic traces -- no level set, no Tile World, no
      # jar -- so the one part that cannot otherwise be tested here is tested on every push.
      - name: Differential trace alignment self-test
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File trace.ps1 -SelfTest

      # The corpus replay is the widest oracle this fork has -- every stored solution through the
      # real engine -- and like the trace it needs data that may not be committed, so the real run
      # is local only. Its previous version was lost from a scratch folder before ever being
      # committed. -SelfTest synthesizes a small collection with test\DatBuilder.java (eight level
      # sets: one unreadable, one well formed under a refused signature, one cut short, one present
      # as both .dat and .ccl) and proves the
      # harness end to end: every status a real collection can produce except the two defensive
      # catch-alls no known input reaches (LOADEXC, STATEEXC); the cross-check against SuperCC's own
      # replay; determinism; the same-jar and unknown-jar refusals; and that real engine-level
      # differences are caught and classified, every count exact.
      # Needs the jar, so it runs after the build.
      - name: Corpus replay harness self-test
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File corpus.ps1 -SelfTest

      - name: Publish test results
        # Runs even when the tests failed -- that is the case where the report matters most.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results
          path: test-results/
          if-no-files-found: warn

      - name: Upload the built jar
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SuperCC-jar
          path: |
            SuperCC.jar
            dist/build-manifest.json
          if-no-files-found: error
